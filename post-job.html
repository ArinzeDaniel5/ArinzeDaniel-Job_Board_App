<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet"href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport"
    content="Width=device-width,
    initial-scale=1.0">
    <title>Post Job</title>
</head>
<body>
    <div class="auth-container">
        <form id="jobForm"class="auth-form">
            <h2>Post Job</h2>
            <input type="text"id="title"placeholder="Job Title"required >
            <input type="text"id="company"placeholder="Company"required >
            <input type="text"id="location"placeholder="Location"required >
            <input type="text"id="salary"placeholder="Salary"required >
            <select id="category">
                <option value=""Disabled selected>Category</option>
                <option value="Development">Development</option>
                <option value="Design">Design</option>
                <option value="Marketing">Marketing</option>
            </select>
            <textarea id="description"placeholder="Job Description..."rows="5"required ></textarea>
            <button type="submit">Post Job</button>
        </form>
    </div>
    <script type="module"src="js/dashboard.js"></script>
</body>
</html>
