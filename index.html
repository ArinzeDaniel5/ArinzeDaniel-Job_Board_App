<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet"href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport"
    content="Width=device-width,
    initial-scale=1.0">
    <title>ArinzeDaniel Job Board</title>
</head>
<body>
    <header class="navbar">
        <div class="logo">ArinzeDaniel Job Board</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="jobs.html">Jobs</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="login.html">Login</a>
        </nav>
        <button id="themeBtn">🌙</button>
    </header>
    <section class="hero">
        <h1>Find Your Dream Job</h1>
        <p>Search thousands of jobs from top companies</p>
        <form id="searchForm"class="search-box">
            <input type="text"id="searchInput"placeholder="Search-box">

        </form>

    <main class="container">
        <div class="section-title">
            <h2>Featured Jobs</h2>
        </div>
        <div id="jobsContainer"class="jobs-grid"></div>
    </main>
    <script type="module"src="js/app.js"></script>
</body>
</html>
